// proto2mysql 自带的建表选项定义。
//
// 用法：在你的 .proto 里 import 本文件，然后在 message / field 上声明表配置，
// 运行时 RegisterTable 会自动读取，无需在 Go 代码里传 TableOption：
//
//	import "proto2mysql_option.proto";
//
//	option (proto2mysql.db) = true;   // 文件级标识：本文件用于 proto2mysql 建表
//
//	message user {
//	  option (proto2mysql.table_name)         = "user";
//	  option (proto2mysql.primary_key)        = "id";           // 逗号分隔 = 联合主键
//	  option (proto2mysql.auto_increment_key) = "id";
//	  option (proto2mysql.index)              = "last_login";   // 分号分隔多个索引；索引内逗号分隔 = 联合索引
//	  option (proto2mysql.unique_key)         = "email";        // 逗号分隔 = 联合唯一键
//
//	  uint64 id = 1;
//	  string email = 2 [(proto2mysql.max_length) = 255];        // 主键/唯一键里的 string/bytes 列宽（默认 191）
//	  string display_name = 3 [(proto2mysql.nullable) = true];  // 该列允许为 NULL
//	  uint64 last_login = 4;
//	}
syntax = "proto3";

package proto2mysql;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/luyuancpp/proto2mysql/pbopt;pbopt";

extend google.protobuf.FileOptions {
  // 标记本 .proto 文件用于 proto2mysql 建表，纯用途声明。
  // 注意：是否建表只取决于各 message 是否声明了 table_name；本选项不影响建表行为。
  optional bool db = 500000;
}

extend google.protobuf.MessageOptions {
  // 表名（必填：声明了才视为一张表）
  optional string table_name = 500001;
  // 主键，逗号分隔 = 联合主键，如 "user_id,provider"
  optional string primary_key = 500002;
  // 自增字段名
  optional string auto_increment_key = 500006;
  // 普通索引：分号分隔多个索引，每个索引内逗号分隔 = 联合索引
  // 如 "player_id;zone_id,created_at"
  optional string index = 500011;
  // 唯一键，逗号分隔 = 联合唯一键，如 "provider,provider_id"
  optional string unique_key = 500012;

  // —— TiDB 方言（下列选项生成 /*T!*/ 扩展注释语法，MySQL 视为普通注释忽略，
  //    同一份 DDL 在 MySQL 与 TiDB 上均可执行）——

  // 主键追加 /*T![clustered_index] NONCLUSTERED */。
  // 业务自赋值的单调主键（如 Snowflake，时间戳在高位）在 TiDB 默认聚簇表下是
  // 官方点名的写热点场景；须配合 tidb_shard_row_id_bits 打散行分布。
  // 代价：主键点查多一次索引回表。
  optional bool tidb_nonclustered_pk = 500021;
  // 追加 /*T! SHARD_ROW_ID_BITS=N */，按 _tidb_rowid 打散写入。
  // 仅对非聚簇主键/无主键表生效：表有主键却未声明 tidb_nonclustered_pk 时，
  // 本选项被忽略并打日志告警（TiDB 聚簇表不支持，生成了也必然建表失败）。
  // 建议取 log2(TiKV 节点数) 数量级。
  optional uint32 tidb_shard_row_id_bits = 500022;
  // 与 SHARD_ROW_ID_BITS 同一注释块内追加 PRE_SPLIT_REGIONS=N（建表即预切 region）。
  // 依赖 tidb_shard_row_id_bits 存在，未声明时本选项被忽略；
  // TiDB 要求 N ≤ SHARD_ROW_ID_BITS，超出时收敛到 shard 值并打日志告警。
  optional uint32 tidb_pre_split_regions = 500023;
  // 表尾追加 /*T![auto_id_cache] AUTO_ID_CACHE=1 */：自增 ID 走集中分配（v6.4+），
  // 近似连续、仅 failover 出现小间隙。用于依赖自增连续性的表；默认按批缓存（3 万/批，重启跳号）。
  optional bool tidb_auto_id_cache_one = 500024;
}

extend google.protobuf.FieldOptions {
  // 该字段对应的列允许为 NULL（默认 NOT NULL）
  optional bool nullable = 600100;
  // 主键/唯一键里 string/bytes 字段的最大长度，决定整列索引的列宽：
  //   string → VARCHAR(N) CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_bin，N 按字符计，取值 1..768；
  //   bytes  → VARBINARY(N)，N 按字节计，取值 1..3072。
  // 不声明时 N = 191。目前仅用于主键/唯一键的 string/bytes 字段，声明在其它字段上（含显式写 0）会被拒绝。
  // 字节预算：单个索引（主键、唯一键、每个普通索引各自计算）所有列合计不得超过 3072 字节（InnoDB
  // 超出报 Error 1071）。VARCHAR(N) 按 4N 计、VARBINARY(N) 按 N 计；int32/uint32/enum/float 计 4，
  // int64/uint64/double/Timestamp 计 8，bool 计 1；普通索引里的非键 string/bytes 走 191 前缀，分别计 764/191。
  // 写入前按 N 校验，超长或非法 UTF-8 返回 ErrInvalidKeyValue，不会截断。
  optional uint32 max_length = 600101;
}
